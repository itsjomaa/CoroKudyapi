<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2320"/>
      <stop offset="100%" stop-color="#141414"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="128" cy="128" r="108" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Stylized Kudyapi / Musical Lyre & Monogram K -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Harp / Kodyapi strings -->
    <path d="M 85,60 L 85,196" stroke-width="10"/>
    <path d="M 85,130 Q 130,95 165,70" stroke-width="8"/>
    <path d="M 105,115 L 175,190" stroke-width="8"/>
    <path d="M 112,65 Q 128,128 112,190" stroke-width="2" stroke-dasharray="2,2"/>
    <path d="M 132,70 Q 148,128 132,185" stroke-width="2" stroke-dasharray="2,2"/>
  </g>
  <!-- Musical notes -->
  <circle cx="175" cy="70" r="10" fill="#D4AF37"/>
  <circle cx="185" cy="190" r="10" fill="#D4AF37"/>
  <!-- Crown / Sun rays (Philippines motif) -->
  <g fill="#D4AF37" opacity="0.9">
    <polygon points="128,24 133,36 128,34 123,36"/>
    <polygon points="172,36 170,48 165,45 163,49"/>
    <polygon points="84,36 89,48 93,45 95,49"/>
  </g>
  <!-- Text ring -->
  <text x="128" y="222" font-family="'Open Sans', sans-serif" font-size="13" font-weight="700" fill="#F3E5AB" text-anchor="middle" letter-spacing="3">CORO KUDYAPI</text>
</svg>
